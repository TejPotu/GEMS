[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gems"
version = "0.0.1"
description = "Mass-difference-biased transformer encoder for FT-ICR broadband MS1 spectra of complex mixtures (a DreaMS-style model re-pointed to petroleomics / DOM / bio-oils)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Teja Potu" }]
keywords = ["mass-spectrometry", "FT-ICR", "petroleomics", "transformer", "self-supervised", "DreaMS", "pyc2mc"]

# NOTE: pyc2mc pins numpy<2.0, pydantic==2.4.2, dask==2024.11.2. torch 2.2-2.3 + lightning
# are compatible with numpy<2.0. Install pyc2mc first (editable from the local checkout or its
# `c2mc` conda env), then this package on top. See env.yml / README for the recommended flow.
dependencies = [
    "numpy<2.0",          # pyc2mc constraint
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.0",  # KMD/van-Krevelen + GBM baseline, metrics
    "h5py>=3.8",
    "omegaconf>=2.3",
    "fire>=0.5",
    "tqdm>=4.65",
    "torch>=2.2,<2.4",
    "pytorch-lightning>=2.0,<2.3",
    "torchmetrics>=1.0",
    # pyc2mc is the data/chemistry backend. It is typically not on PyPI; install it editable
    # from /Users/tejapotu/School/Projects/Maglab/pyc2mc (see README). Left out of the hard
    # dependency list so `pip install -e .` does not fail when pyc2mc is provided by the env.
    # "pyc2mc>=2025.11.25",
]

[project.optional-dependencies]
train = ["wandb>=0.16"]
dev = ["pytest>=7.4", "pytest-cov", "ruff", "black", "ipykernel", "jupyter"]

[project.scripts]
gems = "gems.cli:main"

[tool.setuptools.packages.find]
include = ["gems*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.black]
line-length = 100
