# Workhorse SSL objective: masked-peak modeling only.
objectives: [masked_peak]
mask_prob: 0.15
mask_mz: true
mask_intensity: false
predict: defect           # defect | mz_bin | both
batch_size: 4
optim:
  lr: 3.0e-4
  warmup: 100
  weight_decay: 0.01
trainer:
  accelerator: cpu        # cpu | mps | gpu
  devices: 1
  precision: 32
  max_steps: 1000
  log_every_n_steps: 10
