# Minimal 1-step CPU smoke configuration for the locked denoising objective.
objective: denoising
mask_prob: 0.30
series_span_fraction: 0.3333
replaced_fraction: 0.15
lambda_int: 0.2
lambda_rpd: 0.5
batch_size: 1
optim:
  lr: 3.0e-4
  warmup: 0
  weight_decay: 0.0
trainer:
  accelerator: cpu
  devices: 1
  precision: 32
  max_steps: 1
  log_every_n_steps: 1
