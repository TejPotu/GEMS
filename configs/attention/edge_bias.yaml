# Phase 2: Graphormer-style edge bias over pairwise Δm.
variant: edge_bias
n_heads: 2                  # must match model.n_heads (per-head bias)
ppm_tol: 1.0               # ppm-scaled Δm match window
include_c13: true         # treat 13C spacing (1.00336) as a block (feature) vs drop it (confounder)
use_abundance_weight: true # scale the learned per-block bias by the Δm's corpus abundance (the novelty)
vocab:
  source: seeded          # seeded | corpus | seeded+corpus
  learnable: true
  top_k: 128
