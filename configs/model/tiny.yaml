# CPU/MPS development model.
dim: 64
n_layers: 2
n_heads: 2
ff_mult: 2
dropout: 0.0
max_nominal: 2000        # nominal-mass embedding vocabulary size
use_fourier: false       # false -> LSM1 nominal+defect tokenization; true -> DreaMS Fourier features
aux_features: []         # e.g. ["kmd", "dbe", "oc", "hc"] (computed via pyc2mc)
pooling: cls             # cls | attention
