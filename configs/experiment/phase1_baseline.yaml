# Phase 1 — performance floor: plain transformer + masked-peak pretraining, NO Δm bias.
# Composes sub-configs via `defaults`; experiment-level keys below override them.
defaults:
  - data: fticr_dev
  - model: tiny
  - attention: no_bias
  - peak_selection: top_n
  - pretrain: masked_peak

phase: 1
seed: 0
device: cpu            # cpu | mps | cuda
run_name: phase1_baseline
