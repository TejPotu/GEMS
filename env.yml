# GEMS development environment (CPU-first), layered on top of pyc2mc.
#
# pyc2mc is the data/chemistry backend and pins numpy<2.0 / pydantic==2.4.2 / dask==2024.11.2.
# The simplest path is to start from pyc2mc's own conda env and add the deep-learning stack:
#
#   # 1. create pyc2mc's env (from its checkout) OR create this one
#   conda env create -f env.yml -n gems
#   conda activate gems
#   # 2. install pyc2mc editable (path to your local checkout)
#   pip install -e /Users/tejapotu/School/Projects/Maglab/pyc2mc
#   # 3. install this package
#   pip install -e ".[dev]"
#
# For GPU: replace the CPU torch wheel with the appropriate CUDA build, e.g.
#   pip install torch --index-url https://download.pytorch.org/whl/cu121
name: gems
channels:
  - pytorch
  - conda-forge
dependencies:
  - python>=3.9,<3.12
  - numpy<2.0
  - pandas>=2.0
  - scipy>=1.10
  - scikit-learn>=1.0
  - h5py>=3.8
  - pip
  - pytorch::pytorch>=2.2,<2.4
  - pytorch::cpuonly
  - pip:
      - pytorch-lightning>=2.0,<2.3
      - torchmetrics>=1.0
      - omegaconf>=2.3
      - fire>=0.5
      - tqdm>=4.65
      # pyc2mc: install editable from the local checkout (see header), e.g.
      # - -e /Users/tejapotu/School/Projects/Maglab/pyc2mc
      # dev extras
      - pytest>=7.4
      - ruff
      - black
